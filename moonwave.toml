[docusaurus]
organizationName = "Vlux-Entertainment"
projectName = "VluxyBuildingTools"
deploymentBranch = "gh-pages"
tagline = "Blender-style building tools for Roblox Studio: draw walls, rooms and doorways in a few clicks."
favicon = "VluxFavicon.ico"

url = "https://Vlux-Entertainment.github.io"
baseUrl = "/VluxyBuildingTools/"

[home]
enabled = true
includeReadme = false

[[navbar.items]]
href = "https://discord.gg/Ebbp9UgBUD"
label = "Discord"
position = "right"

[[home.features]]
title = "Draw, don't drag"
description = "Click a start and an end and get a wall, a room, a corridor or a flight of stairs, with a live preview and exact numbers typed as you go."

[[home.features]]
title = "Blender hotkeys"
description = "G, R and C grab, rotate and scale with axis locks and typed values; T extrudes a face; every build is one Studio undo step."

[[home.features]]
title = "Made for teams"
description = "Work inside one tagged folder, share themes and the surface grid through the folder, and never touch anything outside it."
